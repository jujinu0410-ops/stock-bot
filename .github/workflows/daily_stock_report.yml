name: Twice Daily Stock Analysis Report (11:20 AM & 15:35 PM KST)

on:
  schedule:
    # 1차 장중 리포트: 한국시간(KST) 오전 10:20 (UTC 01:20) - GitHub 스케줄 큐 지연을 감안하여 1시간 일찍 트리거 (11:20경 실도착 목표)
    - cron: '20 1 * * 1-5'
    # 2차 장마감 리포트: 한국시간(KST) 오후 15:35 (UTC 06:35) - 장마감 정밀 최종 리포트
    - cron: '35 6 * * 1-5'
  workflow_dispatch: # GitHub 웹 UI에서 수동 즉시 실행 가능 버튼 추가

jobs:
  run-daily-analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Daily Stock Analysis & Email Dispatch
        env:
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
          DART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
          GMAIL_SENDER_EMAIL: ${{ secrets.GMAIL_SENDER_EMAIL }}
          GMAIL_USER: ${{ secrets.GMAIL_SENDER_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          KIWOOM_APP_KEY: ${{ secrets.KIWOOM_APP_KEY }}
          KIWOOM_APP_SECRET: ${{ secrets.KIWOOM_APP_SECRET }}
          KIWOOM_ACCOUNT_NO: ${{ secrets.KIWOOM_ACCOUNT_NO }}
          EMAIL_RENDER_VERSION: V2
          TZ: Asia/Seoul
        run: |
          mkdir -p data logs
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "⚡ [Event: workflow_dispatch] 수동 실행 감지 -> --force 옵션으로 강제 재발송 실행"
            python main.py --force
          else
            echo "⏰ [Event: schedule] 정기 스케줄 실행 -> 중복 방지 검사 적용 실행"
            python main.py
          fi

      - name: Upload Excel & HTML Logs Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stock-daily-reports-${{ github.run_number }}
          path: |
            logs/*.xlsx
            logs/*.html
