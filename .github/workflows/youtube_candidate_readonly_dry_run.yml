name: YouTube Candidate Readonly Exact-Flow Validation

on:
  workflow_dispatch:
  push:
    branches:
      - feat/youtube-candidate-ingest-v0-20260930
      - feat/jev-pregate-20261006
    paths:
      - '.github/workflows/youtube_candidate_readonly_dry_run.yml'
      - 'scripts/youtube_candidate_*.py'
      - 'src/analysis/youtube_candidate_*.py'
      - 'services/youtube_signal_service.py'
      - 'apps_script/*.gs'
      - 'requirements-youtube-signal.txt'
      - 'Dockerfile.youtube-signal'
      - 'tests/test_youtube_*.py'

permissions:
  contents: read

jobs:
  readonly-dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-youtube-signal.txt

      - name: Run YouTube candidate and signal-service unit tests
        run: |
          python -m unittest discover -s tests -p 'test_youtube_*.py' -v

      - name: Compile signal service
        run: |
          python -m py_compile services/youtube_signal_service.py

      - name: Syntax-check Apps Script files
        run: |
          for f in apps_script/*.gs; do
            cp "$f" /tmp/youtube_apps_script_check.js
            node --check /tmp/youtube_apps_script_check.js
          done

      - name: Run identity-gated exact-flow read-only validation
        env:
          GMAIL_SENDER_EMAIL: ${{ secrets.GMAIL_SENDER_EMAIL }}
          GMAIL_USER: ${{ secrets.GMAIL_SENDER_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          KIWOOM_APP_KEY: ${{ secrets.KIWOOM_APP_KEY }}
          KIWOOM_APP_SECRET: ${{ secrets.KIWOOM_APP_SECRET }}
          TZ: Asia/Seoul
        run: |
          mkdir -p logs
          set +e
          python -m scripts.youtube_candidate_registered_ip_validated_dry_run \
            --days 35 \
            --as-of 2026-09-30 \
            --json-out logs/youtube_candidate_exact_flow_validation.json
          DRY_RUN_EXIT=$?
          set -e
          echo "dry_run_exit_code=${DRY_RUN_EXIT}"
          # Exit 2 means the read-only pipeline completed but exact alert readiness is
          # intentionally blocked (e.g. Kiwoom 8050 unregistered GitHub runner IP or
          # a quarantined source identity). Preserve the evidence instead of hiding it.
          if [ "${DRY_RUN_EXIT}" -ne 0 ] && [ "${DRY_RUN_EXIT}" -ne 2 ]; then
            exit "${DRY_RUN_EXIT}"
          fi

      - name: Upload dry-run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-candidate-exact-flow-validation-${{ github.run_number }}
          path: logs/youtube_candidate_exact_flow_validation.json
          if-no-files-found: warn
